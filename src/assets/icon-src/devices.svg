<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    "Один застосунок для всіх пристроїв". The card lists three machines
    (ноутбук, планшет, смартфон) and the icon has to show all three or it is
    illustrating a different sentence — which is exactly what the green
    handset it replaces was doing.

    The three screens carry the SAME yellow app tile. That repetition is the
    whole point of the card: not "we support many devices" but "it is one
    app". The tile was brand blue in the first version, which is also the
    colour of the card this icon sits on — the one mark that had to be
    unmissable was the one that disappeared.

    THREE CLASSES OF DEVICE, TOLD BY SILHOUETTE, NOT BY SIZE. The tablet is
    landscape and wide-bezelled, the phone is portrait at 1:2 with a
    speaker slot and a home line, the laptop has a keyboard deck. The first
    version differentiated them by scale alone, and scale is the one cue
    that does not survive being shrunk to 88px — two rounded rectangles of
    different sizes read as two of the same thing.

    NO GLASS. Both screens used to carry a hard diagonal streak — a white
    path at 0.9 opacity with NO blur on it at all — and the phone shell a
    third at 0.85. That is a window reflection, and nothing in the bought
    pack has one: their share of hard near-white pixels runs 0.00%–1.66%,
    this object read 8.38%, and it was the first thing the client saw. The
    screens are lit by their own gradient now, the way the pack's folder is.
    scripts/check-icons.mjs holds the budget.

    NO PLINTH. The surface the devices used to stand on was the other half
    of the complaint — "менша інших". It was never really a size problem:
    a floor drawn in near-white ate a third of the frame, and what was left
    for the devices themselves was 183px of the 256 box, so inside `.obj`'s
    square 88px they drew 63px tall against the folder's 73 and the bulb's
    85. Removing the floor and spreading the cluster vertically instead puts
    the object at 234, inside the range the bought ones occupy (212–248).
    What the floor was really for — keeping the silhouette off #4050FF —
    is now done the way the tablet and phone already did it, with a cream
    rim, which costs no height and works on a card of any colour.

    MASS, NOT INVENTORY. Side by side at the size they actually render, the
    bought objects are one chunky body in one saturated colour with a small
    cream detail — the folder is blue with a sliver of paper, the tick is a
    green disc. This one was the other way round: big pale screens inside
    thin frames, so at 88px it read as fiddly next to them even after it
    stopped being pale. The bezels are thicker and the screens smaller for
    that reason, the bodies are deep enough to hold a silhouette against
    #4050FF, and the app tiles are large enough to survive the size the
    card draws them at. The phone stays the one saturated body: it was
    already the part of this object that read first.

    Depth is read from the baselines: the laptop is furthest and sits
    highest, the phone is nearest and sits lowest. Each keeps the faint
    contact shadow that rocket/dino/wheel use — a shadow implies the ground
    without anyone having to draw it.
  -->
  <defs>
    <linearGradient id="dvBody" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#606B92"/>
      <stop offset="45%" stop-color="#3E4568"/>
      <stop offset="100%" stop-color="#2A3049"/>
    </linearGradient>
    <linearGradient id="dvDeck" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#7C87A8"/>
      <stop offset="50%" stop-color="#4A5374"/>
      <stop offset="100%" stop-color="#333B58"/>
    </linearGradient>
    <!-- Warm, like the cream the rest of the set uses for detail; the old
         one ran to a cool #CED4E2 and read as a different material. Kept
         off pure white on purpose: with the plinth gone the screens are the
         biggest surfaces here, and at #FFFEF8 they made the object read as
         a pale blob on #4050FF — 38% of its pixels sat at the white point,
         where the bought objects hold 0–28%. Paper, not backlight. -->
    <linearGradient id="dvScreen" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#F3EFE2"/>
      <stop offset="52%" stop-color="#E4DFCE"/>
      <stop offset="100%" stop-color="#CCC7B4"/>
    </linearGradient>
    <linearGradient id="dvApp" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#FFF0A6"/>
      <stop offset="45%" stop-color="#F7DE52"/>
      <stop offset="100%" stop-color="#CFA511"/>
    </linearGradient>
    <filter id="dvb4" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="dvb7" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="dvb10" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <!-- tablet: back, landscape, and the one that carries the mark -->
  <g>
    <ellipse cx="141" cy="180" rx="100" ry="10" fill="#0E1330" opacity=".2" filter="url(#dvb10)"/>
    <rect x="34" y="18" width="214" height="162" rx="26" fill="#FFFFFF"/>
    <rect x="39" y="23" width="204" height="152" rx="22" fill="url(#dvBody)"/>
    <rect x="52" y="36" width="178" height="126" rx="12" fill="url(#dvScreen)"/>
    <g transform="translate(109 67) scale(2)">
      <polygon points="16,3.52 26.81,9.76 26.81,22.24 16,28.48 5.19,22.24 5.19,9.76"
               fill="#4050FF" stroke="#4050FF" stroke-width="6.1" stroke-linejoin="round"/>
      <path d="M20.11 11.3 A6.4 6.4 0 1 0 20.11 21.1"
            fill="none" stroke="#fff" stroke-width="4.4" stroke-linecap="round"/>
    </g>
    <circle cx="45.5" cy="99" r="3" fill="#8A93AD"/>
    <path d="M46 30 L236 30 L233 39 L49 39 Z" fill="#FFFFFF" opacity=".24" filter="url(#dvb4)"/>
  </g>

  <!-- Телефон: спереду і нижче. Корпус тут був зелений - його задумували як
       "пристрій учня", але зелених телефонів не буває, і на 88px це читалося
       не смисловою міткою, а помилкою. Обидва корпуси тепер одного кольору;
       розрізняє їх силует і біле обведення, а не фарба. -->
  <g>
    <ellipse cx="47" cy="250" rx="42" ry="10" fill="#0E1330" opacity=".22" filter="url(#dvb10)"/>
    <rect x="8" y="112" width="78" height="140" rx="27" fill="#FFFFFF"/>
    <rect x="13" y="117" width="68" height="130" rx="23" fill="url(#dvBody)"/>
    <rect x="21" y="134" width="52" height="96" rx="10" fill="url(#dvScreen)"/>
    <rect x="38" y="124" width="18" height="4" rx="2" fill="#0D1120" opacity=".26"/>
    <rect x="38" y="236" width="18" height="3.5" rx="1.75" fill="#0D1120" opacity=".22"/>
    <path d="M15 142 C15 128 21 122 31 120 L31 127 C23 129 20 134 20 145 Z" fill="#FFFFFF" opacity=".3" filter="url(#dvb4)"/>
    <path d="M79 144 L79 228 C79 240 73 245 63 247 L63 240 C72 238 75 234 75 225 L75 144 Z" fill="#141828" opacity=".34" filter="url(#dvb7)"/>
  </g>
</svg>
