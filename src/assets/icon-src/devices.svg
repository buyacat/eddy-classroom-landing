<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    "One app for every device" card: laptop, tablet and phone, all three
    carrying the SAME yellow app tile — that repetition is the card's point.

    Device classes are told apart by silhouette, not scale: landscape
    wide-bezel tablet, 1:2 portrait phone with a speaker slot and home line,
    laptop with a keyboard deck. Scale alone does not survive 88px. Thick
    bezels and small screens keep the object chunky next to the licensed
    pack, and the cream rim holds the silhouette against #4050FF without
    costing the height a floor plinth would.

    Baselines read as depth: the laptop is furthest and sits highest, the
    phone is nearest and sits lowest, each with the faint contact shadow the
    rest of the set uses.
  -->
  <defs>
    <linearGradient id="dvBody" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#606B92"/>
      <stop offset="45%" stop-color="#3E4568"/>
      <stop offset="100%" stop-color="#2A3049"/>
    </linearGradient>
    <linearGradient id="dvDeck" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#7C87A8"/>
      <stop offset="50%" stop-color="#4A5374"/>
      <stop offset="100%" stop-color="#333B58"/>
    </linearGradient>
    <!-- Warm, like the cream the rest of the set uses for detail; the old
         one ran to a cool #CED4E2 and read as a different material. Kept
         off pure white on purpose: with the plinth gone the screens are the
         biggest surfaces here, and at #FFFEF8 they made the object read as
         a pale blob on #4050FF — 38% of its pixels sat at the white point,
         where the bought objects hold 0–28%. Paper, not backlight. -->
    <linearGradient id="dvScreen" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#F3EFE2"/>
      <stop offset="52%" stop-color="#E4DFCE"/>
      <stop offset="100%" stop-color="#CCC7B4"/>
    </linearGradient>
    <linearGradient id="dvApp" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#FFF0A6"/>
      <stop offset="45%" stop-color="#F7DE52"/>
      <stop offset="100%" stop-color="#CFA511"/>
    </linearGradient>
    <filter id="dvb4" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="dvb7" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="dvb10" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <!-- tablet: back, landscape, and the one that carries the mark -->
  <g>
    <ellipse cx="141" cy="180" rx="100" ry="10" fill="#0E1330" opacity=".2" filter="url(#dvb10)"/>
    <rect x="34" y="18" width="214" height="162" rx="26" fill="#FFFFFF"/>
    <rect x="39" y="23" width="204" height="152" rx="22" fill="url(#dvBody)"/>
    <rect x="52" y="36" width="178" height="126" rx="12" fill="url(#dvScreen)"/>
    <g transform="translate(109 67) scale(2)">
      <polygon points="16,3.52 26.81,9.76 26.81,22.24 16,28.48 5.19,22.24 5.19,9.76"
               fill="#4050FF" stroke="#4050FF" stroke-width="6.1" stroke-linejoin="round"/>
      <path d="M20.11 11.3 A6.4 6.4 0 1 0 20.11 21.1"
            fill="none" stroke="#fff" stroke-width="4.4" stroke-linecap="round"/>
    </g>
    <circle cx="45.5" cy="99" r="3" fill="#8A93AD"/>
    <path d="M46 30 L236 30 L233 39 L49 39 Z" fill="#FFFFFF" opacity=".24" filter="url(#dvb4)"/>
  </g>

  <!-- Phone: nearest, so lowest. Same body colour as the tablet — silhouette
       and the white rim tell them apart, not paint. -->
  <g>
    <ellipse cx="47" cy="250" rx="42" ry="10" fill="#0E1330" opacity=".22" filter="url(#dvb10)"/>
    <rect x="8" y="112" width="78" height="140" rx="27" fill="#FFFFFF"/>
    <rect x="13" y="117" width="68" height="130" rx="23" fill="url(#dvBody)"/>
    <rect x="21" y="134" width="52" height="96" rx="10" fill="url(#dvScreen)"/>
    <rect x="38" y="124" width="18" height="4" rx="2" fill="#0D1120" opacity=".26"/>
    <rect x="38" y="236" width="18" height="3.5" rx="1.75" fill="#0D1120" opacity=".22"/>
    <path d="M15 142 C15 128 21 122 31 120 L31 127 C23 129 20 134 20 145 Z" fill="#FFFFFF" opacity=".3" filter="url(#dvb4)"/>
    <path d="M79 144 L79 228 C79 240 73 245 63 247 L63 240 C72 238 75 234 75 225 L75 144 Z" fill="#141828" opacity=".34" filter="url(#dvb7)"/>
  </g>
</svg>
