<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    "Бібліотека 3D-контенту". The client's reference was a glossy cube with
    "3D" on it, and nothing else says three dimensions as fast: a book says
    library, a cube says the thing the library is FULL of.

    Isometric geometry, not perspective — an iso cube reads as a solid at
    96px, where a perspective cube reads as a dented box. The rounded outer
    silhouette is a clip path over three hard-edged faces: rounding the faces
    themselves would round the interior corner too, and a cube with a soft
    centre stops looking like a cube.

    Light comes from the upper left, same as every other object in this set:
    top face lightest, left face the brand blue, right face in shadow.

    THE LIGHT IS BROAD, NOT A HOTSPOT. The bought objects have no specular
    at all — their share of hard near-white pixels runs 0.00%–1.66%
    (scripts/check-icons.mjs prints it). This cube used to answer with a
    tight 0.95-opacity ellipse under a 3px blur, which is glass, not clay,
    and it read as 3.84% — the thing the client pointed at. Every
    highlight here is now wide and weak enough to stay inside the pack's
    own budget.
  -->
  <defs>
    <linearGradient id="c3Top" x1="0.1" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#B4BDF0"/>
      <stop offset="50%" stop-color="#94A0F2"/>
      <stop offset="100%" stop-color="#7280EC"/>
    </linearGradient>
    <linearGradient id="c3Left" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#7684F2"/>
      <stop offset="40%" stop-color="#5666EE"/>
      <stop offset="100%" stop-color="#4450CE"/>
    </linearGradient>
    <linearGradient id="c3Right" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#4E5AD6"/>
      <stop offset="50%" stop-color="#3F49B4"/>
      <stop offset="100%" stop-color="#333C96"/>
    </linearGradient>
    <filter id="c3b6" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="c3b12" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="c3b3" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3"/></filter>

    <!-- the rounded hexagon silhouette: every outer corner cut 16px back and
         bridged with a quadratic through the original vertex -->
    <clipPath id="c3Hex">
      <path d="M141.85 44.02 L190.15 71.98 Q204 80 204 96 L204 152 Q204 168 190.15 176.02
               L141.85 203.98 Q128 212 114.15 203.98 L65.85 176.02 Q52 168 52 152
               L52 96 Q52 80 65.85 71.98 L114.15 44.02 Q128 36 141.85 44.02 Z"/>
    </clipPath>
    <clipPath id="c3TopClip"><path d="M128 36 L204 80 L128 124 L52 80 Z"/></clipPath>
    <clipPath id="c3LeftClip"><path d="M52 80 L128 124 L128 212 L52 168 Z"/></clipPath>
    <clipPath id="c3RightClip"><path d="M128 124 L204 80 L204 168 L128 212 Z"/></clipPath>
  </defs>
  <!-- Scaled to fill the 256 box the way the bought objects do: they run
       246px corner to corner, and an icon drawn to 160 sits visibly
       smaller than its neighbours on the same row. -->
  <g transform="translate(128 128) scale(1.51) translate(-127.5 -123.5)">

  <g clip-path="url(#c3Hex)">
    <!-- three faces, sharing exact edges so no seam shows between them -->
    <path d="M128 36 L204 80 L128 124 L52 80 Z" fill="url(#c3Top)"/>
    <path d="M52 80 L128 124 L128 212 L52 168 Z" fill="url(#c3Left)"/>
    <path d="M128 124 L204 80 L204 168 L128 212 Z" fill="url(#c3Right)"/>

    <!-- key light on the top face, and the shadow it leaves on the far side -->
    <g clip-path="url(#c3TopClip)">
      <ellipse cx="102" cy="63" rx="32" ry="13" transform="rotate(30 102 63)" fill="#FFFFFF" opacity=".42" filter="url(#c3b12)"/>
      <ellipse cx="92" cy="60" rx="20" ry="8" transform="rotate(30 92 60)" fill="#FFFFFF" opacity=".34" filter="url(#c3b6)"/>
      <ellipse cx="182" cy="100" rx="32" ry="17" transform="rotate(-30 182 100)" fill="#3B45B8" opacity=".3" filter="url(#c3b12)"/>
    </g>
    <!-- the lit flank: highlight down the leading edge, occlusion at the foot -->
    <g clip-path="url(#c3LeftClip)">
      <ellipse cx="68" cy="112" rx="11" ry="30" fill="#FFFFFF" opacity=".34" filter="url(#c3b12)"/>
      <ellipse cx="66" cy="104" rx="7" ry="18" fill="#FFFFFF" opacity=".28" filter="url(#c3b6)"/>
      <ellipse cx="110" cy="208" rx="46" ry="22" fill="#3A44A8" opacity=".34" filter="url(#c3b12)"/>
    </g>
    <!-- the shaded flank gets a rim light, or it goes flat black at 96px -->
    <g clip-path="url(#c3RightClip)">
      <ellipse cx="201" cy="112" rx="7" ry="32" fill="#C2C9FF" opacity=".42" filter="url(#c3b6)"/>
      <ellipse cx="152" cy="202" rx="42" ry="24" fill="#2E3794" opacity=".3" filter="url(#c3b12)"/>
    </g>

    <!-- bevel: a cream hairline along the two top edges is what makes clay
         objects look moulded rather than printed -->
      <path d="M128 40 L200 81 M128 40 L56 81" fill="none" stroke="#FFFFFF" stroke-opacity=".4" stroke-width="4" stroke-linecap="round" filter="url(#c3b6)"/>
    <path d="M128 126 L128 208" fill="none" stroke="#2A3390" stroke-opacity=".28" stroke-width="4" stroke-linecap="round" filter="url(#c3b3)"/>
  </g>

  <!--
    "3D" as outlines, not as <text>: this file is rasterised on whatever
    machine builds it and served to browsers that have never heard of
    Manrope — a font fallback would silently reshape the one word the icon
    exists to say. The matrix lays the glyphs flat on the left face
    (x along the face's own +0.579 slope), then centres them on it.
  -->
  <g transform="matrix(1 0.5789 0 1 52 80) translate(8.3 26) scale(0.9)" fill="#F2EBD6">
    <path d="M2.5 3.2 C6.5 1 10.6 0 15.2 0 C23.4 0 29.4 4.6 29.4 11.2 C29.4 15.6 27 18.9 23 20.2
             C27.6 21.3 30 24.8 30 29.2 C30 36.1 23.6 40.6 14.6 40.6 C9.4 40.6 4.4 39.3 0.6 36.9
             L4.1 29.3 C7 31.2 10.7 32.2 14 32.2 C18.3 32.2 20.8 30.6 20.8 28 C20.8 25.5 18.8 24.1 14.7 24.1
             L10.4 24.1 L10.4 17 L14.1 17 C17.8 17 19.7 15.6 19.7 13.2 C19.7 10.8 17.5 9.4 13.9 9.4
             C11.1 9.4 8.1 10.1 5.6 11.5 Z"/>
    <path fill-rule="evenodd" d="M36 0 L49 0 C60.6 0 66 8.95 66 20.3 C66 31.65 60.6 40.6 49 40.6
             L36 40.6 Z M45.2 9.2 L45.2 31.4 L49 31.4 C54.4 31.4 56.8 27 56.8 20.3 C56.8 13.6 54.4 9.2 49 9.2 Z"/>
  </g>
  </g>
</svg>
