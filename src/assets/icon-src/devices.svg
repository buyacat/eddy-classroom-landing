<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    "Один застосунок для всіх пристроїв". The card lists three machines
    (ноутбук, планшет, смартфон) and the icon has to show all three or it is
    illustrating a different sentence — which is exactly what the green
    handset it replaces was doing.

    The three screens carry the SAME yellow app tile. That repetition is the
    whole point of the card: not "we support many devices" but "it is one
    app". The tile was brand blue in the first version, which is also the
    colour of the card this icon sits on — the one mark that had to be
    unmissable was the one that disappeared.

    THREE CLASSES OF DEVICE, TOLD BY SILHOUETTE, NOT BY SIZE. The tablet is
    landscape and wide-bezelled, the phone is portrait at 1:2 with a
    speaker slot and a home line, the laptop has a keyboard deck. The first
    version differentiated them by scale alone, and scale is the one cue
    that does not survive being shrunk to 88px — two rounded rectangles of
    different sizes read as two of the same thing.

    THE PLINTH is the "підложка" the client asked for, built into the object
    instead of parked behind it. A tinted plate under the icon would break
    the rule this whole system is designed around (style.css: objects break
    out of their card, they do not sit in plates), and a plate under only
    the three colour cards would read as an accident. A surface the devices
    STAND on is not a plate — it is part of the thing being drawn, it works
    on a card of any colour, and it gives the silhouette the light base it
    needs against #4050FF. The tablet and phone keep their cream halos on
    top of that, which is what separates them from the laptop behind.
  -->
  <defs>
    <linearGradient id="dvBody" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#525B7C"/>
      <stop offset="45%" stop-color="#2E3550"/>
      <stop offset="100%" stop-color="#14192A"/>
    </linearGradient>
    <linearGradient id="dvDeck" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#7D86A6"/>
      <stop offset="50%" stop-color="#454D6B"/>
      <stop offset="100%" stop-color="#1E2337"/>
    </linearGradient>
    <linearGradient id="dvPhone" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#B6F7DC"/>
      <stop offset="42%" stop-color="#5AE3A8"/>
      <stop offset="100%" stop-color="#169B6A"/>
    </linearGradient>
    <linearGradient id="dvScreen" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FFFFFA"/>
      <stop offset="50%" stop-color="#F2F4F0"/>
      <stop offset="100%" stop-color="#CED4E2"/>
    </linearGradient>
    <linearGradient id="dvApp" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#FFF0A6"/>
      <stop offset="45%" stop-color="#F7DE52"/>
      <stop offset="100%" stop-color="#CFA511"/>
    </linearGradient>
    <linearGradient id="dvPlinth" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFFFB"/>
      <stop offset="45%" stop-color="#EDF0F6"/>
      <stop offset="100%" stop-color="#BCC4D6"/>
    </linearGradient>
    <filter id="dvb2" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="dvb5" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="dvb10" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <g transform="translate(2 2)">

    <!-- the surface, drawn first: everything standing on it overlaps it -->
    <path d="M44 168 L212 168 Q226 168 230 180 L242 202 Q246 212 234 212 L22 212 Q10 212 14 202 L26 180 Q30 168 44 168 Z" fill="url(#dvPlinth)"/>
    <path d="M44 168 L212 168 Q226 168 229 178 L38 178 Q30 178 26 180 Q30 168 44 168 Z" fill="#FFFFFF" opacity=".85" filter="url(#dvb2)"/>
    <path d="M232 196 L242 202 Q246 212 234 212 L150 212 Z" fill="#8F99B2" opacity=".4" filter="url(#dvb5)"/>

    <!-- laptop: furthest back, so it stands on the plinth's back edge -->
    <g>
      <ellipse cx="96" cy="172" rx="86" ry="11" fill="#0E1330" opacity=".26" filter="url(#dvb10)"/>
      <rect x="28" y="40" width="132" height="96" rx="10" fill="url(#dvBody)"/>
      <rect x="36" y="48" width="116" height="80" rx="6" fill="url(#dvScreen)"/>
      <rect x="78" y="72" width="32" height="32" rx="9" fill="url(#dvApp)"/>
      <!-- one hot streak on the glass, not a sheen over the whole panel -->
      <path d="M36 112 L84 48 L100 48 L44 124 L36 124 Z" fill="#FFFFFF" opacity=".92"/>
      <path d="M36 124 L92 48 L100 48 L44 128 L36 128 Z" fill="#A9B2C8" opacity=".28"/>
      <!-- top bezel catches the key light -->
      <path d="M34 44 L154 44 L152 49 L36 49 Z" fill="#FFFFFF" opacity=".4" filter="url(#dvb2)"/>
      <path d="M18 136 L170 136 L182 162 Q185 168 178 168 L10 168 Q3 168 6 162 Z" fill="url(#dvDeck)"/>
      <rect x="74" y="138" width="48" height="8" rx="4" fill="#0D1120" opacity=".5"/>
      <path d="M18 136 L170 136 L168 141 L20 141 Z" fill="#FFFFFF" opacity=".5" filter="url(#dvb2)"/>
    </g>

    <!-- tablet: landscape, wide bezels, a camera dot on the short side -->
    <g>
      <ellipse cx="192" cy="174" rx="52" ry="12" fill="#0E1330" opacity=".28" filter="url(#dvb10)"/>
      <rect x="135" y="95" width="114" height="82" rx="17" fill="#FFFDF3"/>
      <rect x="140" y="100" width="104" height="72" rx="13" fill="url(#dvBody)"/>
      <rect x="148" y="108" width="88" height="56" rx="8" fill="url(#dvScreen)"/>
      <rect x="176" y="122" width="28" height="28" rx="8" fill="url(#dvApp)"/>
      <circle cx="144" cy="136" r="2.6" fill="#8A93AD"/>
      <path d="M148 156 L182 108 L194 108 L156 164 L148 164 Z" fill="#FFFFFF" opacity=".9"/>
      <path d="M148 164 L190 108 L194 108 L158 164 Z" fill="#A9B2C8" opacity=".26"/>
      <path d="M146 104 L238 104 L236 109 L148 109 Z" fill="#FFFFFF" opacity=".36" filter="url(#dvb2)"/>
    </g>

    <!-- phone: portrait at 1:2, nearest the viewer, and the only saturated
         body — the eye lands on the pupil's device first, which is the one
         the card's promise is really about -->
    <g>
      <ellipse cx="70" cy="208" rx="34" ry="11" fill="#0E1330" opacity=".3" filter="url(#dvb10)"/>
      <rect x="43" y="111" width="54" height="100" rx="17" fill="#FFFDF3"/>
      <rect x="48" y="116" width="44" height="90" rx="13" fill="url(#dvPhone)"/>
      <rect x="54" y="128" width="32" height="58" rx="7" fill="url(#dvScreen)"/>
      <rect x="59" y="146" width="22" height="22" rx="6.5" fill="url(#dvApp)"/>
      <rect x="62" y="120" width="16" height="3.6" rx="1.8" fill="#0D1120" opacity=".32"/>
      <rect x="62" y="192" width="16" height="3" rx="1.5" fill="#0D1120" opacity=".26"/>
      <path d="M54 172 L74 128 L82 128 L58 186 L54 186 Z" fill="#FFFFFF" opacity=".9"/>
      <!-- specular on the green shell: tight, near-white, upper left only -->
      <path d="M50 132 C50 123 55 118 62 117 L62 122 C56 123 54 127 54 133 Z" fill="#FFFFFF" opacity=".85" filter="url(#dvb2)"/>
      <path d="M88 140 L88 190 C88 198 84 202 77 203 L77 198 C83 197 85 194 85 188 L85 140 Z" fill="#0A6647" opacity=".38" filter="url(#dvb2)"/>
    </g>
  </g>
</svg>
